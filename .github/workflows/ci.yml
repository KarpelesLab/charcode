name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Format
        if: runner.os == 'Linux' # formatting is platform-independent
        run: cargo fmt --all --check

      - name: Clippy (all features, warnings denied)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --all-features

      # The library alone, with no optional feature pulled in: catches a `std`,
      # `alloc` or `serde` path that only compiles because something else
      # enabled it.
      - name: Test (no default features)
        run: cargo test --no-default-features

      - name: Test (alloc, no std)
        run: cargo test --no-default-features --features alloc

      # Each table group has to stand on its own: a build asking for one
      # encoding must not fail on a table another encoding owns.
      - name: Test (one table group at a time)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for group in single-byte big5 euc-jp euc-kr gb18030 iso-2022-jp \
                       shift-jis dos ebcdic mac misc; do
            echo "::group::$group"
            cargo test --no-default-features --features "alloc,$group"
            echo "::endgroup::"
          done
          # The alias layer is independent of which tables are taken, and adding
          # a group outside the standard must not widen what it can select.
          cargo test --no-default-features --features alloc,whatwg-aliases
          cargo test --no-default-features \
            --features alloc,whatwg-aliases,shift-jis,euc-jp,iso-2022-jp
          cargo test --no-default-features --features alloc,whatwg-aliases,dos
          cargo test --no-default-features --features alloc,extras

  no_std:
    name: no_std builds (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # thumbv7em-none-eabi is a 32-bit bare-metal target: it catches both
        # accidental `std` dependencies and 64-bit-only arithmetic (the gb18030
        # four-byte pointers reach 1_237_575, and index tables are addressed by
        # `usize`).
        target: [x86_64-unknown-linux-gnu, thumbv7em-none-eabi]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # No allocator at all.  `extern crate alloc` is itself feature-gated, so
      # a stray `alloc::` path in an ungated module fails here as E0433 rather
      # than silently requiring a heap on a target that has none.
      - name: Build without an allocator
        run: cargo build --target ${{ matrix.target }} --no-default-features

      - name: Build with alloc, without std
        run: cargo build --target ${{ matrix.target }} --no-default-features --features alloc

      # serde must drag in neither `std` nor `alloc`: an encoding serializes as
      # a borrowed `&'static str`, which needs neither.
      - name: Build with serde, without alloc
        run: cargo build --target ${{ matrix.target }} --no-default-features --features serde

      - name: Build with serde and alloc, without std
        run: cargo build --target ${{ matrix.target }} --no-default-features --features serde,alloc

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build and test the CLI
        run: cargo test --features cli --test cli

      # A last check that the built tool behaves at the shell, where the exit
      # status and the stderr summary are what a script depends on.
      - name: Smoke test the installed binary
        run: |
          set -euo pipefail
          cargo build --release --features cli
          bin=target/release/charcode
          printf 'caf\xe9' | "$bin" -f latin1 -t utf-8 | diff - <(printf 'caf\xc3\xa9')
          printf '\xe6\x97\xa5' | "$bin" -t iso-2022-jp | diff - <(printf '\x1b$BF|\x1b(B')
          test "$("$bin" --list | wc -l)" -eq 40
          # A lossy conversion must report itself in the exit status.
          if printf 'a\xff' | "$bin" -c > /dev/null 2>&1; then
            echo "expected a non-zero exit for a lossy conversion" >&2
            exit 1
          fi

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Keep this pin in sync with `rust-version` in Cargo.toml. Compiling on
      # the declared minimum guards against accidentally using a std/library or
      # language feature newer than 1.88 (behavior itself is covered by the
      # stable `test` job, so this is compile-only).
      - name: Install Rust 1.88 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.88

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: cargo check --all-features --all-targets
        run: cargo check --all-features --all-targets

  tables:
    name: Generated tables are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3"

      # Regenerating from the checked-in copy of the standard's index data must
      # be a no-op; if it is not, either the generator or src/tables/ drifted.
      - name: Regenerate from tools/data
        run: python3 tools/generate_tables.py --offline

      - name: Fail if regenerating changed anything
        run: git diff --exit-code src/tables

  docs:
    name: Docs build (warnings denied)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings -D rustdoc::broken-intra-doc-links
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo doc --no-deps --all-features
        run: cargo doc --no-deps --all-features
