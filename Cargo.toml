[package]
name = "charcode"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Character encoding conversion implementing the WHATWG Encoding Standard, with no external dependencies."
repository = "https://github.com/KarpelesLab/charcode"
documentation = "https://docs.rs/charcode"
readme = "README.md"
keywords = ["encoding", "charset", "utf-8", "unicode", "conversion"]
categories = ["encoding", "text-processing", "no-std"]
exclude = ["/tools", "/.github"]

[dependencies]
serde = { version = "1", optional = true, default-features = false }

[dev-dependencies]
serde_json = "1"

[features]
default = ["std"]
# Implements `std::error::Error` for the error types.  Implies `alloc`.
std = ["alloc"]
# The conveniences that hand back an owned `String`, `Vec` or `Cow`.  Turning it
# off leaves the streaming API, which converts into caller-provided buffers and
# never allocates.
alloc = []
# An encoding serializes as its name.  Needs neither `std` nor `alloc`.
serde = ["dep:serde"]
# The `charcode` command-line tool, an iconv-style converter (gates the binary
# target below).  It adds no dependencies.
cli = ["std"]

[[bin]]
name = "charcode"
path = "src/bin/charcode/main.rs"
required-features = ["cli"]

[package.metadata.docs.rs]
all-features = true

[profile.release]
opt-level = 3
